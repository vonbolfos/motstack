groups:
- name: k8s.rules.container_cpu_usage_seconds_total
  rules:
  - expr: "sum by (cluster, namespace, pod, container) (\n  rate(container_cpu_usage_seconds_total{job=\"\
      kubernetes-nodes-cadvisor\", metrics_path=\"/metrics/cadvisor\", image!=\"\"\
      }[5m])\n) * on (cluster, namespace, pod) group_left(node) topk by (cluster,\
      \ namespace, pod) (\n  1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=\"\
      \"})\n)"
    record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
  - expr: "sum by (cluster, namespace, pod, container) (\n  irate(container_cpu_usage_seconds_total{job=\"\
      kubernetes-nodes-cadvisor\", metrics_path=\"/metrics/cadvisor\", image!=\"\"\
      }[5m])\n) * on (cluster, namespace, pod) group_left(node) topk by (cluster,\
      \ namespace, pod) (\n  1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=\"\
      \"})\n)"
    record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
- name: k8s.rules.container_memory_cache
  rules:
  - expr: "container_memory_cache{job=\"kubernetes-nodes-cadvisor\", metrics_path=\"\
      /metrics/cadvisor\", image!=\"\"}\n* on (cluster, namespace, pod) group_left(node)\
      \ topk by (cluster, namespace, pod) (1,\n  max by (cluster, namespace, pod,\
      \ node) (kube_pod_info{node!=\"\"})\n)"
    record: node_namespace_pod_container:container_memory_cache
- name: k8s.rules.container_memory_rss
  rules:
  - expr: "container_memory_rss{job=\"kubernetes-nodes-cadvisor\", metrics_path=\"\
      /metrics/cadvisor\", image!=\"\"}\n* on (cluster, namespace, pod) group_left(node)\
      \ topk by (cluster, namespace, pod) (1,\n  max by (cluster, namespace, pod,\
      \ node) (kube_pod_info{node!=\"\"})\n)"
    record: node_namespace_pod_container:container_memory_rss
- name: k8s.rules.container_memory_swap
  rules:
  - expr: "container_memory_swap{job=\"kubernetes-nodes-cadvisor\", metrics_path=\"\
      /metrics/cadvisor\", image!=\"\"}\n* on (cluster, namespace, pod) group_left(node)\
      \ topk by (cluster, namespace, pod) (1,\n  max by (cluster, namespace, pod,\
      \ node) (kube_pod_info{node!=\"\"})\n)"
    record: node_namespace_pod_container:container_memory_swap
- name: k8s.rules.container_memory_working_set_bytes
  rules:
  - expr: "container_memory_working_set_bytes{job=\"kubernetes-nodes-cadvisor\", metrics_path=\"\
      /metrics/cadvisor\", image!=\"\"}\n* on (cluster, namespace, pod) group_left(node)\
      \ topk by (cluster, namespace, pod) (1,\n  max by (cluster, namespace, pod,\
      \ node) (kube_pod_info{node!=\"\"})\n)"
    record: node_namespace_pod_container:container_memory_working_set_bytes
- name: k8s.rules.container_resource
  rules:
  - expr: "kube_pod_container_resource_requests{resource=\"memory\",job=\"kube-state-metrics\"\
      }  * on (namespace, pod, cluster)\ngroup_left() max by (namespace, pod, cluster)\
      \ (\n  (kube_pod_status_phase{phase=~\"Pending|Running\"} == 1)\n)"
    record: cluster:namespace:pod_memory:active:kube_pod_container_resource_requests
  - expr: "sum by (namespace, cluster) (\n    sum by (namespace, pod, cluster) (\n\
      \        max by (namespace, pod, container, cluster) (\n          kube_pod_container_resource_requests{resource=\"\
      memory\",job=\"kube-state-metrics\"}\n        ) * on (namespace, pod, cluster)\
      \ group_left() max by (namespace, pod, cluster) (\n          kube_pod_status_phase{phase=~\"\
      Pending|Running\"} == 1\n        )\n    )\n)"
    record: namespace_memory:kube_pod_container_resource_requests:sum
  - expr: "kube_pod_container_resource_requests{resource=\"cpu\",job=\"kube-state-metrics\"\
      }  * on (namespace, pod, cluster)\ngroup_left() max by (namespace, pod, cluster)\
      \ (\n  (kube_pod_status_phase{phase=~\"Pending|Running\"} == 1)\n)"
    record: cluster:namespace:pod_cpu:active:kube_pod_container_resource_requests
  - expr: "sum by (namespace, cluster) (\n    sum by (namespace, pod, cluster) (\n\
      \        max by (namespace, pod, container, cluster) (\n          kube_pod_container_resource_requests{resource=\"\
      cpu\",job=\"kube-state-metrics\"}\n        ) * on (namespace, pod, cluster)\
      \ group_left() max by (namespace, pod, cluster) (\n          kube_pod_status_phase{phase=~\"\
      Pending|Running\"} == 1\n        )\n    )\n)"
    record: namespace_cpu:kube_pod_container_resource_requests:sum
  - expr: "kube_pod_container_resource_limits{resource=\"memory\",job=\"kube-state-metrics\"\
      }  * on (namespace, pod, cluster)\ngroup_left() max by (namespace, pod, cluster)\
      \ (\n  (kube_pod_status_phase{phase=~\"Pending|Running\"} == 1)\n)"
    record: cluster:namespace:pod_memory:active:kube_pod_container_resource_limits
  - expr: "sum by (namespace, cluster) (\n    sum by (namespace, pod, cluster) (\n\
      \        max by (namespace, pod, container, cluster) (\n          kube_pod_container_resource_limits{resource=\"\
      memory\",job=\"kube-state-metrics\"}\n        ) * on (namespace, pod, cluster)\
      \ group_left() max by (namespace, pod, cluster) (\n          kube_pod_status_phase{phase=~\"\
      Pending|Running\"} == 1\n        )\n    )\n)"
    record: namespace_memory:kube_pod_container_resource_limits:sum
  - expr: "kube_pod_container_resource_limits{resource=\"cpu\",job=\"kube-state-metrics\"\
      }  * on (namespace, pod, cluster)\ngroup_left() max by (namespace, pod, cluster)\
      \ (\n (kube_pod_status_phase{phase=~\"Pending|Running\"} == 1)\n )"
    record: cluster:namespace:pod_cpu:active:kube_pod_container_resource_limits
  - expr: "sum by (namespace, cluster) (\n    sum by (namespace, pod, cluster) (\n\
      \        max by (namespace, pod, container, cluster) (\n          kube_pod_container_resource_limits{resource=\"\
      cpu\",job=\"kube-state-metrics\"}\n        ) * on (namespace, pod, cluster)\
      \ group_left() max by (namespace, pod, cluster) (\n          kube_pod_status_phase{phase=~\"\
      Pending|Running\"} == 1\n        )\n    )\n)"
    record: namespace_cpu:kube_pod_container_resource_limits:sum
  - record: namespace_cpu:kube_pod_container_resource_requests
    expr: namespace_cpu:kube_pod_container_resource_requests:sum
  - record: namespace_cpu:kube_pod_container_resource_limits
    expr: namespace_cpu:kube_pod_container_resource_limits:sum
  - record: namespace_memory:kube_pod_container_resource_requests
    expr: namespace_memory:kube_pod_container_resource_requests:sum
  - record: namespace_memory:kube_pod_container_resource_limits
    expr: namespace_memory:kube_pod_container_resource_limits:sum
- name: k8s.rules.pod_owner
  rules:
  - expr: "max by (cluster, namespace, workload, pod) (\n  label_replace(\n    label_replace(\n\
      \      kube_pod_owner{job=\"kube-state-metrics\", owner_kind=\"ReplicaSet\"\
      },\n      \"replicaset\", \"$1\", \"owner_name\", \"(.*)\"\n    ) * on (cluster,\
      \ replicaset, namespace) group_left(owner_name) topk by (cluster, replicaset,\
      \ namespace) (\n      1, max by (cluster, replicaset, namespace, owner_name)\
      \ (\n        kube_replicaset_owner{job=\"kube-state-metrics\", owner_kind=\"\
      \"}\n      )\n    ),\n    \"workload\", \"$1\", \"replicaset\", \"(.*)\"\n \
      \ )\n)"
    labels:
      workload_type: replicaset
    record: namespace_workload_pod:kube_pod_owner:relabel
  - expr: "max by (cluster, namespace, workload, pod) (\n  label_replace(\n    label_replace(\n\
      \      kube_pod_owner{job=\"kube-state-metrics\", owner_kind=\"ReplicaSet\"\
      },\n      \"replicaset\", \"$1\", \"owner_name\", \"(.*)\"\n    ) * on (replicaset,\
      \ namespace, cluster) group_left(owner_name) topk by (cluster, replicaset, namespace)\
      \ (\n      1, max by (cluster, replicaset, namespace, owner_name) (\n      \
      \  kube_replicaset_owner{job=\"kube-state-metrics\", owner_kind=\"Deployment\"\
      }\n      )\n    ),\n    \"workload\", \"$1\", \"owner_name\", \"(.*)\"\n  )\n\
      )"
    labels:
      workload_type: deployment
    record: namespace_workload_pod:kube_pod_owner:relabel
  - expr: "max by (cluster, namespace, workload, pod) (\n  label_replace(\n    kube_pod_owner{job=\"\
      kube-state-metrics\", owner_kind=\"DaemonSet\"},\n    \"workload\", \"$1\",\
      \ \"owner_name\", \"(.*)\"\n  )\n)"
    labels:
      workload_type: daemonset
    record: namespace_workload_pod:kube_pod_owner:relabel
  - expr: "max by (cluster, namespace, workload, pod) (\n  label_replace(\n    kube_pod_owner{job=\"\
      kube-state-metrics\", owner_kind=\"StatefulSet\"},\n  \"workload\", \"$1\",\
      \ \"owner_name\", \"(.*)\")\n)"
    labels:
      workload_type: statefulset
    record: namespace_workload_pod:kube_pod_owner:relabel
  - expr: "group by (cluster, namespace, workload, pod) (\n  label_join(\n    group\
      \ by (cluster, namespace, job_name, pod, owner_name) (\n      label_join(\n\
      \        kube_pod_owner{job=\"kube-state-metrics\", owner_kind=\"Job\"}\n  \
      \    , \"job_name\", \"\", \"owner_name\")\n    )\n    * on (cluster, namespace,\
      \ job_name) group_left()\n    group by (cluster, namespace, job_name) (\n  \
      \    kube_job_owner{job=\"kube-state-metrics\", owner_kind=~\"Pod|\"}\n    )\n\
      \  , \"workload\", \"\", \"owner_name\")\n)"
    labels:
      workload_type: job
    record: namespace_workload_pod:kube_pod_owner:relabel
  - expr: "max by (cluster, namespace, workload, pod) (\n  label_replace(\n    kube_pod_owner{job=\"\
      kube-state-metrics\", owner_kind=\"\", owner_name=\"\"},\n  \"workload\", \"\
      $1\", \"pod\", \"(.+)\")\n)"
    labels:
      workload_type: barepod
    record: namespace_workload_pod:kube_pod_owner:relabel
  - expr: "max by (cluster, namespace, workload, pod) (\n  label_replace(\n    kube_pod_owner{job=\"\
      kube-state-metrics\", owner_kind=\"Node\"},\n  \"workload\", \"$1\", \"pod\"\
      , \"(.+)\")\n)"
    labels:
      workload_type: staticpod
    record: namespace_workload_pod:kube_pod_owner:relabel
  - expr: "group by (cluster, namespace, workload, workload_type, pod) (\n  label_join(\n\
      \    label_join(\n      group by (cluster, namespace, job_name, pod) (\n   \
      \     label_join(\n          kube_pod_owner{job=\"kube-state-metrics\", owner_kind=\"\
      Job\"}\n        , \"job_name\", \"\", \"owner_name\")\n      )\n      * on (cluster,\
      \ namespace, job_name) group_left(owner_kind, owner_name)\n      group by (cluster,\
      \ namespace, job_name, owner_kind, owner_name) (\n        kube_job_owner{job=\"\
      kube-state-metrics\", owner_kind!=\"Pod\", owner_kind!=\"\"}\n      )\n    ,\
      \ \"workload\", \"\", \"owner_name\")\n  , \"workload_type\", \"\", \"owner_kind\"\
      )\n\n  OR\n\n  label_replace(\n    label_replace(\n      label_replace(\n  \
      \      kube_pod_owner{job=\"kube-state-metrics\", owner_kind=\"ReplicaSet\"\
      }\n        , \"replicaset\", \"$1\", \"owner_name\", \"(.+)\"\n      )\n   \
      \   * on (cluster, namespace, replicaset) group_left(owner_kind, owner_name)\n\
      \      group by (cluster, namespace, replicaset, owner_kind, owner_name) (\n\
      \        kube_replicaset_owner{job=\"kube-state-metrics\", owner_kind!=\"Deployment\"\
      , owner_kind!=\"\"}\n      )\n    , \"workload\", \"$1\", \"owner_name\", \"\
      (.+)\")\n    OR\n    label_replace(\n      group by (cluster, namespace, pod,\
      \ owner_name, owner_kind) (\n        kube_pod_owner{job=\"kube-state-metrics\"\
      , owner_kind!=\"ReplicaSet\", owner_kind!=\"DaemonSet\", owner_kind!=\"StatefulSet\"\
      , owner_kind!=\"Job\", owner_kind!=\"Node\", owner_kind!=\"\"}\n      )\n  \
      \    , \"workload\", \"$1\", \"owner_name\", \"(.+)\"\n    )\n  , \"workload_type\"\
      , \"$1\", \"owner_kind\", \"(.+)\")\n)"
    record: namespace_workload_pod:kube_pod_owner:relabel

- name: k8s.rules.node_exporter
  rules:
  - record: cluster:node_cpu:ratio_rate5m
    expr: sum by (cluster) (rate(node_cpu_seconds_total{mode!="idle",mode!="iowait",mode!="steal"}[5m])) / sum by (cluster) (rate(node_cpu_seconds_total[5m]))
  - record: :node_memory_MemAvailable_bytes:sum
    expr: sum by (cluster) (node_memory_MemAvailable_bytes{job="node-exporter"})
  - record: instance:node_num_cpu:sum
    expr: count by (cluster, instance) (node_cpu_seconds_total{mode="idle"})
  - record: instance:node_cpu_utilisation:rate5m
    expr: 1 - avg by (cluster, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
  - record: instance:node_load1_per_cpu:ratio
    expr: node_load1 / instance:node_num_cpu:sum
  - record: instance:node_memory_utilisation:ratio
    expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
  - record: instance:node_vmstat_pgmajfault:rate5m
    expr: rate(node_vmstat_pgmajfault[5m])
  - record: instance:node_network_receive_bytes_excluding_lo:rate5m
    expr: rate(node_network_receive_bytes_total{device!="lo"}[5m])
  - record: instance:node_network_transmit_bytes_excluding_lo:rate5m
    expr: rate(node_network_transmit_bytes_total{device!="lo"}[5m])
  - record: instance:node_network_receive_drop_excluding_lo:rate5m
    expr: rate(node_network_receive_drop_total{device!="lo"}[5m])
  - record: instance:node_network_transmit_drop_excluding_lo:rate5m
    expr: rate(node_network_transmit_drop_total{device!="lo"}[5m])
  - record: instance_device:node_disk_io_time_seconds:rate5m
    expr: rate(node_disk_io_time_seconds_total[5m])
  - record: instance_device:node_disk_io_time_weighted_seconds:rate5m
    expr: rate(node_disk_io_time_weighted_seconds_total[5m])
