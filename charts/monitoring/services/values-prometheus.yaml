prometheus:
  enabled: true
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true
  prometheus-pushgateway:
    enabled: false
  alertmanager:
    enabled: false
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: alertops
        group_by:
          - alertname
          - namespace
          - cluster
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
      receivers:
        - name: alertops
          webhook_configs:
            - url: "https://notify.alertops.com/POSTAlert/612fd4a5-7821-40e2-aa1f-a8432cfccc71/Grafana"
              send_resolved: true

  serverFiles:
    prometheus.yml:
      rule_files:
        - /etc/config/recording_rules.yml
        - /etc/config/alerting_rules.yml
        - /etc/prometheus/rules/*.yml
      scrape_configs:
        - job_name: coredns
          static_configs:
            - targets:
              - coredns-metrics.kube-system.svc.cluster.local:9153
              labels:
                cluster: central
        - job_name: argocd
          static_configs:
            - targets:
              - argocd-metrics.kdp-argocd.svc.cluster.local:8082
              labels:
                cluster: central

