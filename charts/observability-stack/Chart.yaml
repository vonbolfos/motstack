apiVersion: v2
name: observability-stack
description: >
  Toggleable Grafana + Prometheus + Loki + Tempo stack. Each dependency
  below is gated by an `enabled` flag in values.yaml (Helm's `condition:`
  mechanism) — set it false, commit, push, and ArgoCD's automated prune
  removes that component's resources.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # Prometheus + Alertmanager + node-exporter + kube-state-metrics + the
  # Prometheus Operator. Its bundled Grafana is disabled in values.yaml —
  # we run Grafana as its own independent toggle instead.
  - name: kube-prometheus-stack
    version: ">=88.0.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled

  - name: grafana
    version: ">=5.0.0"
    repository: https://grafana-community.github.io/helm-charts
    condition: grafana.enabled

  - name: loki
    version: ">=18.0.0"
    repository: https://grafana-community.github.io/helm-charts
    condition: loki.enabled

  - name: tempo
    version: ">=2.0.0"
    repository: https://grafana-community.github.io/helm-charts
    condition: tempo.enabled
