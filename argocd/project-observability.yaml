apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: >
    Storage, ingress/TLS, and the monitoring stack, deployed onto the
    Talos cluster from ArgoCD running on the workstation VM. Scoped so a
    misconfigured Application here can't touch anything outside these
    namespaces on either cluster.

  sourceRepos:
    - https://github.com/vonbolfos/motstack.git
    - https://charts.longhorn.io
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://charts.jetstack.io
    - https://kubernetes.github.io/ingress-nginx

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: longhorn-system
      name: observability-cluster
    - namespace: observability
      name: observability-cluster
      # ^ the old observability-stack's namespace — safe to remove this
      #   entry once that Application is fully torn down and you've
      #   confirmed nothing's still using it.
    - namespace: kube-system
      name: observability-cluster
    - namespace: cert-manager
      name: observability-cluster
    - namespace: ingress-nginx
      name: observability-cluster
    - namespace: monitoring
      name: observability-cluster

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
    - group: argoproj.io
      kind: Application
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    # Added proactively, not reactively — we've now hit the "wildcard
    # doesn't actually cover this cluster-scoped kind" wall three times
    # (argoproj.io, apiextensions.k8s.io, rbac.authorization.k8s.io +
    # admissionregistration.k8s.io together). IngressClass is new to
    # this repo with ingress-nginx; adding it explicitly up front rather
    # than waiting to find out the hard way a fourth time.
    - group: networking.k8s.io
      kind: IngressClass
  clusterResourceBlacklist: []
