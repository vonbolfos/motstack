apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: >
    Storage plus the Grafana/Prometheus/Loki/Tempo stack, deployed onto
    the Talos cluster from ArgoCD running on the workstation VM. Scoped
    so a misconfigured Application here can't touch anything outside
    these namespaces on either cluster.

  sourceRepos:
    - https://github.com/vonbolfos/motstack.git
    - https://charts.longhorn.io
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: longhorn-system
      name: observability-cluster
    - namespace: observability
      name: observability-cluster

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
    - group: argoproj.io
      kind: Application
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  clusterResourceBlacklist: []

  # Cluster-scoped resources Longhorn's controllers legitimately need.
  # Anything not listed here is blocked even if a synced manifest tries
  # to create it.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
